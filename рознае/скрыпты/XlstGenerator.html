<!DOCTYPE html>
<html lang="be">
<head>
  <meta charset="UTF-8">
  <title>XML → XSLT Генератар</title>
  <style>
    body { font-family: Arial; display: flex; gap: 10px; padding: 10px; }
    textarea { width: 45%; height: 90vh; font-family: monospace; }
    button { height: 40px; }
    .controls { display:flex; flex-direction:column; gap:8px; }
    input { padding:5px; }
  </style>
</head>
<body>

<textarea id="input" placeholder="Paste XML here"></textarea>

<div class="controls">
  <label>Назва элемента (напрыклад Item):</label>
  <input id="tagName" value="Item">

  <label>Атрыбуты (праз коску, напрыклад name,mesh,weight):</label>
  <input id="attrList" value="name">

  <button onclick="generateXSLT()">→ Генераваць XSLT</button>
  <button onclick="copyOutput()">Капіяваць</button>
</div>

<textarea id="output" placeholder="XSLT output"></textarea>

<script>
function generateXSLT() {
  const xmlText = document.getElementById("input").value;
  const tagName = document.getElementById("tagName").value.trim();
  const attrList = document.getElementById("attrList").value
    .split(",")
    .map(a => a.trim())
    .filter(a => a.length > 0);

  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, "text/xml");

  const items = xml.getElementsByTagName(tagName);

  let xslt =
`<?xml version="1.0" encoding="UTF-8"?>
<xsl:stylesheet version="1.0"
  xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

  <xsl:output method="xml" indent="yes" encoding="UTF-8"/>
`;

  for (let item of items) {
    const id = item.getAttribute("id");
    if (!id) continue;

    for (let attr of attrList) {
      const value = item.getAttribute(attr) || "";

      xslt += `
  <xsl:template match="${tagName}[@id='${id}']/@${attr}">
    <xsl:attribute name="${attr}">${escapeXML(value)}</xsl:attribute>
  </xsl:template>
`;
    }
  }

  xslt += `
</xsl:stylesheet>`;

  document.getElementById("output").value = xslt;
}

function escapeXML(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;");
}

function copyOutput() {
  const out = document.getElementById("output");
  out.select();
  document.execCommand("copy");
}
</script>

</body>
</html>
